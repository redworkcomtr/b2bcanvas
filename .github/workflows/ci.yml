name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    name: Syntax + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, zip
          coverage: none

      - name: Setup PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo service postgresql start
          sudo -u postgres psql -c "CREATE ROLE b2bcanvas LOGIN PASSWORD 'b2bcanvas';"
          sudo -u postgres createdb -O b2bcanvas b2bcanvas
          sudo -u postgres createdb -O b2bcanvas b2bcanvas_test

      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Check PHP syntax
        run: php scripts/check-php-syntax.php

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install node deps
        run: npm ci

      - name: Build frontend assets
        run: npm run build
