services:
  db:
    image: postgres:16-alpine
    container_name: b2bcanvas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: b2bcanvas
      POSTGRES_USER: b2bcanvas
      POSTGRES_PASSWORD: b2bcanvas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2bcanvas"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: b2bcanvas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    container_name: b2bcanvas-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio
    container_name: b2bcanvas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    container_name: b2bcanvas-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/b2bcanvas-artifacts || true;
      mc anonymous set download local/b2bcanvas-artifacts || true;
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2bcanvas-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
      mailpit:
      minio:
      minio-init:
    environment:
      APP_NAME: "B2B Canvas"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8010
      APP_KEY: "base64:XC3p6OXg9oDVvkWXHNicV8OeGBcLoc6KvwW1xEfjNxg="
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: b2bcanvas
      DB_USERNAME: b2bcanvas
      DB_PASSWORD: b2bcanvas
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      SESSION_DRIVER: database
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: b2bcanvas-artifacts
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: http://localhost:9000/b2bcanvas-artifacts
      BROADCAST_CONNECTION: log
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: hello@b2bcanvas.local
      MAIL_FROM_NAME: "B2B Canvas"
    ports:
      - "8010:8000"
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage
    command: >
      sh -lc "if [ ! -f .env ]; then cp .env.example .env; fi;
      php artisan migrate --force;
      php artisan storage:link;
      php artisan serve --host=0.0.0.0 --port=8000"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2bcanvas-queue
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      APP_ENV: local
      APP_KEY: "base64:XC3p6OXg9oDVvkWXHNicV8OeGBcLoc6KvwW1xEfjNxg="
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: b2bcanvas
      DB_USERNAME: b2bcanvas
      DB_PASSWORD: b2bcanvas
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      SESSION_DRIVER: database
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: b2bcanvas-artifacts
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_ENDPOINT: http://minio:9000
    command: >
      sh -lc "if [ ! -f .env ]; then cp .env.example .env; fi;
      php artisan queue:work redis --sleep=2 --tries=3 --timeout=90"

volumes:
  postgres_data:
  minio_data:
  app_storage:
